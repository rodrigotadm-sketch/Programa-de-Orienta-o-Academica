<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Programa de Orientação Acadêmica | Biomedicina UFPR</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#173b2b;background:#f5f8f5}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#075634,#168251);color:white;padding:54px max(22px,calc((100vw - 1050px)/2))}header small{letter-spacing:.08em}h1{font-size:clamp(2rem,4vw,3rem);margin:16px 0}header p{max-width:750px;line-height:1.65}nav{background:white;border-bottom:1px solid #dbe6dd;position:sticky;top:0;z-index:3}nav>div{max-width:1050px;margin:auto;display:flex;gap:12px;overflow:auto;padding:12px 20px}nav a{color:#075634;text-decoration:none;font-weight:bold;padding:9px 12px;white-space:nowrap;border-radius:7px}nav a:hover{background:#e5f3e9}main{max-width:1050px;margin:30px auto;padding:0 20px}section{scroll-margin-top:90px;background:white;border:1px solid #e0e9e2;border-radius:14px;padding:28px;margin-bottom:22px;box-shadow:0 2px 10px #123d2510}.eyebrow{color:#168251;font-size:.8rem;font-weight:bold;text-transform:uppercase;letter-spacing:.06em}h2{margin:8px 0 18px}p{line-height:1.65}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:18px}.link{border:1px solid #dbe7df;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}.link strong{line-height:1.4}.btn{display:inline-block;background:#08613b;color:white!important;text-decoration:none;padding:10px 14px;border-radius:8px;font-weight:bold;width:fit-content}.btn:hover{background:#07492e}.notice{border-left:4px solid #168251;background:#eff8f1;padding:14px;margin:18px 0;border-radius:4px;line-height:1.55}details{border:1px solid #dbe7df;border-radius:10px;margin:10px 0;padding:14px}summary{cursor:pointer;font-weight:bold;line-height:1.5}details p{margin-bottom:0}footer{text-align:center;padding:28px;background:#073f2a;color:white;line-height:1.5}.error{color:#8c1b1b;background:#fff1f1;padding:18px;border-radius:8px}a:focus-visible,summary:focus-visible{outline:3px solid #e9b949} @media(max-width:600px){header{padding:36px 20px}section{padding:20px}}
</style></head><body><header id="hero"></header><nav><div id="nav"></div></nav><main id="main"><p>Carregando conteúdo…</p></main><footer id="footer"></footer><script>
const E=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=String(text);return x};
const add=(parent,child)=>{parent.appendChild(child);return child};
function render(d){document.title=d.meta?.titulo||document.title;const hero=document.getElementById('hero');hero.replaceChildren();add(hero,E('small','',d.hero?.sobretitulo||''));add(hero,E('h1','',d.hero?.titulo||''));add(hero,E('p','',d.hero?.descricao||''));if(d.hero?.destinoBotao){const a=add(hero,E('a','btn',d.hero.textoBotao||'Saiba mais'));a.href=d.hero.destinoBotao}
const nav=document.getElementById('nav');nav.replaceChildren();(d.navegacao||[]).forEach(n=>{const a=add(nav,E('a','',n.texto||n.id));a.href='#'+n.id});const main=document.getElementById('main');main.replaceChildren();(d.secoes||[]).forEach(s=>{const section=add(main,E('section'));section.id=s.id;add(section,E('div','eyebrow',s.etiqueta||''));add(section,E('h2','',s.titulo||''));(s.paragrafos||[]).forEach(t=>add(section,E('p','',t)));if(s.aviso)add(section,E('div','notice',s.aviso));if(s.links?.length){const grid=add(section,E('div','links'));s.links.forEach(l=>{const card=add(grid,E('div','link'));add(card,E('strong','',l.titulo));if(l.url){const a=add(card,E('a','btn',l.botao||'Acessar'));a.href=l.url;a.target='_blank';a.rel='noopener noreferrer'}else add(card,E('span','', 'Link indisponível'))})}if(s.etapas?.length){s.etapas.forEach(step=>{const details=add(section,E('details'));add(details,E('summary','',`${step.numero}. ${step.titulo} — ${step.responsavel}`));add(details,E('p','',step.descricao))})}});document.getElementById('footer').textContent=d.rodape||''}
fetch('./dados.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(render).catch(e=>{document.getElementById('main').replaceChildren(E('div','error','Não foi possível carregar dados.json. Publique index.html e dados.json na mesma pasta em um servidor HTTPS (por exemplo, GitHub Pages). Detalhe: '+e.message));console.error(e)});
</script></body></html>
