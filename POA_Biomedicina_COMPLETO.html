amento.docx", "botao": "Baixar Word"}, {"titulo": "05 — Plano de Estudos Discente", "url": "https://bio.ufpr.br/biomedicina/wp-content/uploads/sites/4/2026/10/05_PLANO-DE-ESTUDOS-DISCENTE.docx", "botao": "Baixar Word"}], "aviso": "Proteção de dados: não encaminhe formulários preenchidos por páginas públicas. Os registros individuais devem tramitar exclusivamente pelos canais institucionais autorizados."}, {"id": "procedimentos", "etiqueta": "Fluxo administrativo e pedagógico", "titulo": "Procedimentos de registro e acompanhamento", "paragrafos": ["Passo a passo adaptado do tutorial da Coordenação. Selecione cada etapa para consultar as responsabilidades e ações."], "aviso": "A nomenclatura exata do tipo processual e a configuração de sigilo devem ser conferidas no SEI e nas orientações institucionais vigentes. O conteúdo pedagógico é de responsabilidade do tutor; a Secretaria confere a existência dos registros e mantém o controle administrativo.", "etapas": [{"numero": 1, "responsavel": "Secretaria", "titulo": "Abertura do processo individual no SEI", "descricao": "Conferir nome, GRR e semestre de ingresso no acompanhamento. Abrir processo individual com tipo adequado ao POA, conferir nomenclatura disponível, classificação de acesso e registrar número SEI e tutor em controle interno sem dados sensíveis desnecessários."}, {"numero": 2, "responsavel": "Secretaria", "titulo": "Inclusão da Coordenação e da Secretaria", "descricao": "Providenciar acesso às coordenadoras e aos servidores autorizados da Secretaria, respeitando as permissões aplicáveis aos processos sigilosos."}, {"numero": 3, "responsavel": "Secretaria", "titulo": "Inclusão do professor tutor", "descricao": "Confirmar designação do tutor, conceder acesso autorizado ao processo e comunicar número SEI, documentos necessários e cronograma de registros por e-mail institucional."}, {"numero": 4, "responsavel": "Secretaria e tutor", "titulo": "Termo de Confidencialidade e Sigilo do tutor", "descricao": "Disponib
